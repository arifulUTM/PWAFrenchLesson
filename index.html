<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Français A1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mon Français A1</title>
<style>
:root{--paper:#fbfcff;--sheet:#fff;--rule:#d3def5;--red:#e03a52;--ink:#17266b;--gr:#5b6482;--hl:#ffec85;--now:rgba(255,236,133,.38);--btn:#17266b;--btn-tx:#fff;--blue:#2a4bd7;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#10162c;--sheet:#18203d;--rule:#27325d;--red:#ff6b81;--ink:#e9eeff;--gr:#9aa5cc;--hl:rgba(255,230,107,.28);--now:rgba(255,230,107,.13);--btn:#9db3ff;--btn-tx:#10162c;--blue:#9db3ff}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 190px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:700 30px/1.1 var(--serif);letter-spacing:-.01em;margin:0}
.flag{display:flex;width:64px;height:6px;border-radius:3px;overflow:hidden;margin-top:10px}
.flag i{flex:1}.flag i:nth-child(1){background:#2a4bd7}.flag i:nth-child(2){background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}.flag i:nth-child(3){background:#e03a52}
button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:var(--btn);color:var(--btn-tx);cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--rule)}
button:disabled{opacity:.45}
#inst{font-size:13px;padding:7px 12px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--rule);margin:16px 0 14px}
.tabs button{background:none;color:var(--gr);border-radius:0;padding:10px 2px;border-bottom:3px solid transparent;margin-bottom:-1px;font-size:16px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--gr)}a{color:var(--blue)}
select{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink);max-width:100%}
#flt{display:flex;gap:10px 14px;flex-wrap:wrap;margin-bottom:16px}
#flt label{display:flex;flex-direction:column;gap:3px}

details{margin:0 0 26px}
summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 0 10px;border-bottom:2px solid var(--ink);font:700 21px/1.2 var(--serif)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 24px/1 system-ui;color:var(--gr);order:3}
details[open] summary::after{content:"\2013"}
summary .cnt{margin-left:auto;font:500 13px system-ui;color:var(--gr)}
details>.sec{margin:12px 0 4px;font-size:14px;padding:8px 14px}

.item{position:relative;display:grid;grid-template-columns:44px 1fr auto;column-gap:24px;align-items:start;padding:14px 4px 14px 6px;border-bottom:1px solid var(--rule)}
.item::before{content:"";position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--red);opacity:.4}
.item.now{background:linear-gradient(90deg,var(--now),transparent 90%)}.item.now::before{opacity:1}
.item .t{min-width:0}
.ic{width:44px;height:44px;padding:0 0 0 3px;display:grid;place-items:center;font-size:15px;flex:none}
.ic.sec{width:34px;height:34px;padding:0;font-size:13px;color:var(--gr)}
.fr{font:700 23px/1.2 var(--serif);color:var(--ink);overflow-wrap:anywhere}
.ipa{display:inline-block;margin-top:5px;font-size:15px;color:var(--ink);padding:0 3px;background:linear-gradient(transparent 56%,var(--hl) 56%)}
.bn,.ph{font-family:'Noto Sans Bengali','Kohinoor Bangla','Nirmala UI','Bangla Sangam MN',system-ui,sans-serif}
.ph{margin-top:5px;font-size:14px;color:var(--gr)}
.bn{margin-top:6px;font-size:18px;font-weight:600;color:var(--ink)}
.en{margin-top:2px;font-size:14.5px;font-style:italic;color:var(--gr)}
.tag{margin-top:4px;font-size:11px;color:var(--gr)}
.nt{margin:12px 0 6px;padding:10px 14px 12px;border-left:3px solid var(--red);background:var(--now)}.nt h3{margin:0 0 6px;font:700 18px/1.25 var(--serif);color:var(--ink)}.nt .bn,.nt .en{white-space:pre-line}.nt .en{margin-top:6px}.nt .exs{margin-top:10px;border-top:1px solid var(--rule)}.nt .ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule)}.nt .ex:last-child{border-bottom:0}.nt .ex .fr{font-size:18px}.nt .ex .bn{margin-top:3px;font-size:15px}.nt .ex .en{margin-top:1px;font-size:13.5px}.nt .ex button{width:34px;height:34px;font-size:12px;flex:none}
.day{margin:20px 0 2px;font:700 16px var(--serif);color:var(--gr)}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:16px}
input[type=text],input:not([type]){width:100%;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;background:transparent;color:var(--ink);font:inherit;padding:12px 2px;margin-bottom:4px}
input::placeholder{color:var(--gr);opacity:.8}
input[type=text]:focus,input:not([type]):focus{outline:none;border-bottom-color:var(--red)}
#save{width:100%;padding:13px;margin-top:10px}

.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:640px;margin:0 auto}
#status{margin:0 0 8px;font-size:12.5px;color:var(--gr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vNote{margin:0 0 8px;font-size:12px;color:var(--red)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ctl+.ctl{margin-top:8px}
#playAll{padding:11px 22px;font-weight:700}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{padding:7px 13px;border:1px solid var(--rule);border-radius:999px;font-size:14px;color:var(--gr);background:var(--sheet)}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.chip span:lang(bn),.chip span.bnc{font-size:15px}
.ctl .lbl{font-size:13px;color:var(--gr);min-width:34px}
@media (prefers-reduced-motion:no-preference){.item{transition:background .3s}}
</style>
</head>
<body>
<main>
<header class="top">
  <div><h1>Mon français A1</h1><div class="flag"><i></i><i></i><i></i></div></div>
  <button id="inst" class="sec" hidden>Install app</button>
</header>
<nav class="tabs"><button data-t="lessons">Lessons</button><button data-t="notes">My notes</button></nav>

<section id="tLessons">
  <div class="row" id="flt" style="margin-bottom:12px" hidden>
    <label class="note">Lesson <select id="lsn"></select></label>
    <label class="note">Words per group <select id="gsz"><option>10</option><option>20</option><option>50</option></select></label>
    <label class="note">Show <select id="grp"></select></label>
  </div>
  <div id="lessons"></div>
</section>

<section id="tNotes">
  <div class="card">
    <input id="fr" placeholder="Français (ex: Bonjour)" autocapitalize="none">
    <input id="ipa" placeholder="IPA (ex: /bɔ̃.ʒuʁ/)" autocapitalize="none" autocomplete="off">
    <input id="bnph" placeholder="বাংলা উচ্চারণ (যেমন: বঁজুর)" lang="bn">
    <input id="enph" placeholder="English sound (ex: bohn-ZHOOR)" autocapitalize="none" autocomplete="off">
    <input id="bn" placeholder="বাংলা অর্থ" lang="bn">
    <input id="en" placeholder="English meaning">
    <p class="note" style="margin:0 0 8px"><a id="lk" href="https://en.wiktionary.org/wiki/Wiktionary:Main_Page" target="_blank" rel="noopener">Look up IPA on Wiktionary ↗</a></p>
    
    <div class="row" style="margin-top:10px"><button id="save">Save today</button></div>
  </div>
  <div id="notes"></div>
  <div class="card">
    <div class="row">
      <button id="exp" class="sec">⬇ Export backup</button>
      <button id="imp" class="sec">⬆ Import backup</button>
      <input type="file" id="impf" accept=".json,application/json" hidden>
    </div>
    <p class="note" id="bk" style="margin:8px 0 0">Backup saves your notes in one .json file.</p>
  </div>
</section>
</main>

<div class="player"><div class="in">
  <p id="status">Tap ▶ on a word, or play everything below.</p>
  <p id="vNote" hidden></p>
  <div class="ctl">
    <button id="playAll">▶ Play all</button>
    <button id="stop" class="sec">■ Stop</button>
    <label class="chip"><input type="checkbox" id="loop"><span>Loop</span></label>
  </div>
  <div class="ctl">
    <span class="lbl">Say</span>
    <label class="chip"><input type="checkbox" id="sFr" checked><span>French</span></label>
    <label class="chip"><input type="checkbox" id="sBn"><span class="bnc" lang="bn">বাংলা</span></label>
    <label class="chip"><input type="checkbox" id="sEn"><span>English</span></label>
  </div>
</div></div>
<audio id="aud" playsinline></audio>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let gsz=20,grp='all',lsn='all';try{gsz=+localStorage.getItem('fr-gsz')||20;grp=localStorage.getItem('fr-grp')||'all';lsn=localStorage.getItem('fr-lsn')||'all'}catch(e){}
let notes=[],recs={},lessons=[],db=null,mem=false,tab='lessons',pend=null,runId=0,rec=null,ip=null;
const aud=$('aud');

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('inst').hidden=false});
$('inst').onclick=async()=>{if(ip){ip.prompt();ip=null;$('inst').hidden=true}};

// ---------- storage
function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('fr-a1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('notes',{keyPath:'id'});r.result.createObjectStore('rec',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
function tx(st,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
async function put(st,v){if(!mem)try{await tx(st,'readwrite',s=>s.put(v))}catch(e){mem=true}}
async function del(st,id){if(!mem)try{await tx(st,'readwrite',s=>s.delete(id))}catch(e){}}
async function load(){
  try{db=await openDB();notes=await tx('notes','readonly',s=>s.getAll())||[];(await tx('rec','readonly',s=>s.getAll())||[]).forEach(x=>recs[x.id]=x.blob)}catch(e){mem=true}
  render();
  await loadLessons();
}

// auto-load data/lessons/lesson-1.json, lesson-2.json, ... (stops after 3 missing numbers in a row)
let sig='',pageSig=null;
async function loadLessons(){
  const got=[];
  for(let n=1,miss=0;miss<3&&n<=500;n++){
    try{
      const r=await fetch('data/lessons/lesson-'+n+'.json',{cache:'no-cache'});if(!r.ok)throw 0;
      const j=await r.json();
      (j.lessons||[j]).forEach(l=>{if(l&&(Array.isArray(l.items)||Array.isArray(l.notes))){l.items=l.items||[];l.notes=Array.isArray(l.notes)?l.notes:[];l.id=l.id||n;l.title=l.title||'Lesson '+l.id;l.items.forEach((it,i)=>{it.id=it.id||'L'+l.id+'-'+String(i+1).padStart(2,'0')});got.push(l)}});
      miss=0;
    }catch(e){miss++}
  }
  if(got.length){got.sort((a,b)=>a.id-b.id);const s2=JSON.stringify(got);if(s2!==sig){sig=s2;lessons=got;if(!rec)render()}}
}
// pick up new lessons whenever the app comes back to the screen
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!rec){loadLessons();checkPage()}});
// if a newer index.html was uploaded, reload (only when nothing would be lost)
async function checkPage(){
  try{
    const t=await (await fetch('index.html',{cache:'no-cache'})).text();let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;
    if(pageSig===null)pageSig=h;
    else if(pageSig!==h&&aud.paused&&!rec&&!pend&&!['fr','ipa','bnph','enph','bn','en'].some(k=>$(k).value))location.reload();
  }catch(e){}
}
// every 10 seconds (while the app is on screen): check for new lessons and a new app version
setInterval(()=>{if(document.visibilityState==='visible'&&!rec){loadLessons();checkPage()}},10000);
checkPage();

// ---------- playback
function silentWav(ms){const n=8*ms,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
const GAP=silentWav(900);
function speak(t,lang='fr-FR'){return new Promise(res=>{
  if(!('speechSynthesis' in window))return res();
  const p=lang.slice(0,2);if(p!=='fr'&&!hasVoice(p))return res();
  const u=new SpeechSynthesisUtterance(String(t).replace(/\s*\/\s*/g,', '));u.lang=lang;u.rate=p==='fr'?.85:.95;
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(p));
  const v=vs.find(v=>v.lang.toLowerCase().replace('_','-')===lang.toLowerCase())||vs[0];if(v)u.voice=v;
  u.onend=u.onerror=()=>res();speechSynthesis.speak(u)})}
function hasVoice(p){const v=speechSynthesis.getVoices();return !v.length||v.some(x=>x.lang&&x.lang.toLowerCase().replace('_','-').startsWith(p))}
function voiceNote(){const n=$('vNote');const miss=$('sBn').checked&&'speechSynthesis' in window&&!hasVoice('bn');n.hidden=!miss;if(miss)n.textContent='No Bangla voice found on this phone, so Bangla will be skipped. Android: Settings > Text-to-speech > Google > Install voice data > Bangla.'}
['sFr','sBn','sEn'].forEach(k=>{try{const v=localStorage.getItem('fr-'+k);if(v!==null)$(k).checked=v==='1'}catch(e){}$(k).onchange=()=>{try{localStorage.setItem('fr-'+k,$(k).checked?'1':'0')}catch(e){}voiceNote()}});
function playSrc(s){return new Promise(res=>{aud.src=s;aud.onended=aud.onerror=()=>res();aud.play().catch(()=>res())})}
function meta(it){if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:it.fr,artist:it.en||'Français A1',album:'Mon Français A1',artwork:[{src:'icons/icon-512.png',sizes:'512x512',type:'image/png'}]})}catch(e){}}}
async function playOne(it){
  meta(it);const my=runId;markNow(it.id);
  const fr=$('sFr').checked||!($('sBn').checked||$('sEn').checked);
  if(fr){const b=recs[it.id];if(b){const u=URL.createObjectURL(b);await playSrc(u);URL.revokeObjectURL(u)}else if(it.audio)await playSrc(it.audio);else await speak(it.fr)}
  if($('sBn').checked&&it.bn&&my===runId)await speak(it.bn,'bn-BD');
  if($('sEn').checked&&it.en&&my===runId)await speak(it.en,'en-US');
}
function markNow(id){document.querySelectorAll('.item').forEach(e=>{const on=e.dataset.id===id;e.classList.toggle('now',on);if(on)e.scrollIntoView({block:'nearest',behavior:'smooth'})})}
function stopAll(){runId++;markNow(null);try{speechSynthesis.cancel()}catch(e){}aud.pause();aud.dispatchEvent(new Event('ended'))}
async function run(list){
  stopAll();const my=++runId;
  if('mediaSession' in navigator){try{const m=navigator.mediaSession;
    m.setActionHandler('nexttrack',()=>{aud.pause();aud.dispatchEvent(new Event('ended'));try{speechSynthesis.cancel()}catch(e){}});
    m.setActionHandler('pause',()=>{stopAll();$('status').textContent='Stopped.'})}catch(e){}}
  do{for(let i=0;i<list.length&&my===runId;i++){
      $('status').textContent='Playing '+(i+1)+'/'+list.length+': '+list[i].fr;
      await playOne(list[i]);if(my===runId)await playSrc(GAP)}
  }while($('loop').checked&&my===runId&&list.length);
  if(my===runId){$('status').textContent='Done.';markNow(null)}
}
$('playAll').onclick=()=>run(tab==='lessons'?view().flatMap(([l,items])=>items):[...notes].sort((a,b)=>a.ts-b.ts));
$('stop').onclick=()=>{stopAll();$('status').textContent='Stopped.'};

// ---------- render
function row(it,canDel){
  const r=el('div','item'),t=el('div','t');r.dataset.id=it.id;
  const b=el('button','ic','▶');b.onclick=()=>{stopAll();playOne(it)};
  t.append(el('div','fr',it.fr));
  if(it.ipa)t.append(el('div','ipa',it.ipa));
  const ph=[it.bnph,it.enph].filter(Boolean).join('  ·  ');if(ph){const x=el('div','ph',ph);x.lang='bn';t.append(x)}
  if(it.bn){const x=el('div','bn',it.bn);x.lang='bn';t.append(x)}
  if(it.en)t.append(el('div','en',it.en));
  if(it.audio||recs[it.id])t.append(el('div','tag','🔊 audio file'));
  r.append(b,t);
  if(canDel){const x=el('button','sec ic','✕');x.onclick=async()=>{notes=notes.filter(n=>n.id!==it.id);delete recs[it.id];await del('notes',it.id);await del('rec',it.id);render()};r.append(x)}
  return r;
}
function noteCard(n){
  const c=el('div','nt');
  if(n.title)c.append(el('h3','',n.title));
  if(n.bn){const x=el('div','bn',n.bn);x.lang='bn';c.append(x)}
  if(n.en)c.append(el('div','en',n.en));
  if(Array.isArray(n.examples)&&n.examples.length){const w=el('div','exs');
    n.examples.forEach((ex,i)=>{const r=el('div','ex'),t=el('div','t');
      const b=el('button','sec ic','▶');b.onclick=()=>{stopAll();playOne({id:'x'+i,fr:ex.fr,en:ex.en,bn:ex.bn})};
      t.append(el('div','fr',ex.fr));
      if(ex.bn){const x=el('div','bn',ex.bn);x.lang='bn';t.append(x)}
      if(ex.en)t.append(el('div','en',ex.en));
      r.append(b,t);w.append(r)});
    c.append(w)}
  return c}
function selLessons(){
  if(lsn==='all')return lessons;
  if(lsn[0]==='r'){const k=+lsn.slice(1);return lessons.slice(k*20,(k+1)*20)}
  return lessons.filter(l=>String(l.id)===lsn)}
function flat(){return selLessons().flatMap(l=>l.items.map(it=>({l,it})))}
function view(){ // [[lesson, itemsToShow], ...]
  const f=flat(),part=grp==='all'?f:f.slice(+grp*gsz,(+grp+1)*gsz),m=new Map();
  part.forEach(({l,it})=>{if(!m.has(l))m.set(l,[]);m.get(l).push(it)});return [...m]}
function saveF(){try{localStorage.setItem('fr-gsz',gsz);localStorage.setItem('fr-grp',grp);localStorage.setItem('fr-lsn',lsn)}catch(e){}}
function fillGroups(){
  const nl=Math.ceil(lessons.length/20);
  const ok=lsn==='all'||(lsn[0]==='r'&&lessons.length>20&&+lsn.slice(1)<nl)||lessons.some(l=>String(l.id)===lsn);
  if(!ok)lsn='all';
  const ls=$('lsn'),g=$('grp');
  ls.innerHTML='';ls.append(new Option('All lessons','all'));
  if(lessons.length>20)for(let k=0;k<nl;k++){const p=lessons.slice(k*20,(k+1)*20);ls.append(new Option('Lessons '+p[0].id+'–'+p[p.length-1].id,'r'+k))}
  lessons.forEach(l=>ls.append(new Option(l.title+' ('+l.items.length+')',l.id)));
  const total=flat().length,n=Math.ceil(total/gsz);
  if(grp!=='all'&&+grp>=n)grp='all';
  g.innerHTML='';g.append(new Option('All words ('+total+')','all'));
  for(let k=0;k<n;k++)g.append(new Option('Words '+(k*gsz+1)+'–'+Math.min(total,(k+1)*gsz),k));
  ls.value=lsn;g.value=grp;$('gsz').value=gsz;
  $('flt').hidden=lessons.reduce((a,l)=>a+l.items.length,0)<=10;
}
$('gsz').onchange=()=>{gsz=+$('gsz').value;grp='all';saveF();render()};
$('lsn').onchange=()=>{lsn=$('lsn').value;grp='all';saveF();render()};
$('grp').onchange=()=>{grp=$('grp').value;saveF();render()};
function render(){
  fillGroups();
  $('tLessons').hidden=tab!=='lessons';$('tNotes').hidden=tab!=='notes';
  document.querySelectorAll('.tabs button').forEach(b=>b.className=b.dataset.t===tab?'on':'');
  const L=$('lessons');L.innerHTML='';
  if(!lessons.length)L.append(el('p','note','No lessons found. Check data/lessons/lesson-1.json.'));
  const V=view();
  if(grp==='all')selLessons().forEach(l=>{if(!l.items.length&&l.notes.length)V.push([l,[]])});
  V.sort((a,b)=>lessons.indexOf(a[0])-lessons.indexOf(b[0]));
  [...V].reverse().forEach(([l,items],i)=>{
    const d=el('details');d.open=i===0;
    const nn=l.notes.length,wt=items.length===l.items.length?items.length+(items.length===1?' word':' words'):items.length+' of '+l.items.length;
    const sm=el('summary','',l.title);sm.append(el('span','cnt',(items.length?wt:'')+(items.length&&nn?' · ':'')+(nn?nn+(nn>1?' notes':' note'):'')));d.append(sm);
    if(items.length){const pb=el('button','sec','▶ Play these ('+items.length+')');pb.style.margin='10px 0 0';pb.onclick=()=>run(items);d.append(pb)}
    if(nn&&(!items.length||items[0]===l.items[0]))l.notes.forEach(n=>d.append(noteCard(n)));
    items.forEach(it=>d.append(row(it,false)));L.append(d)});
  const N=$('notes');N.innerHTML='';let last='';
  if(!notes.length)N.append(el('p','note','No notes yet. Add your first word above.'));
  [...notes].sort((a,b)=>b.ts-a.ts).forEach(it=>{
    if(it.day!==last){last=it.day;N.append(el('div','day',new Date(it.day+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})))}
    N.append(row(it,true))});
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});

// ---------- add note
$('fr').addEventListener('input',()=>{const w=$('fr').value.trim().split(/\s+/)[0];$('lk').href=w?'https://en.wiktionary.org/wiki/'+encodeURIComponent(w.toLowerCase())+'#French':'https://en.wiktionary.org/wiki/Wiktionary:Main_Page'});
$('save').onclick=async()=>{
  const fr=$('fr').value.trim();if(!fr)return;
  const ts=Date.now(),it={id:'n'+ts,ts,fr,ipa:$('ipa').value.trim(),bnph:$('bnph').value.trim(),enph:$('enph').value.trim(),bn:$('bn').value.trim(),en:$('en').value.trim(),day:new Date(ts).toISOString().slice(0,10)};
  notes.unshift(it);await put('notes',it);
  if(pend){recs[it.id]=pend;await put('rec',{id:it.id,blob:pend});pend=null}
  ['fr','ipa','bnph','enph','bn','en'].forEach(k=>$(k).value='');
  render();
};

// ---------- backup
function b2d(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function d2b(d){const i=d.indexOf(','),mime=d.slice(5,d.indexOf(';')),bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})}
$('exp').onclick=async()=>{
  try{
    const out={v:2,notes:[],lessonRecs:{}};
    for(const n of notes)out.notes.push({...n,audio:recs[n.id]?await b2d(recs[n.id]):null});
    for(const k in recs)if(k[0]==='L')out.lessonRecs[k]=await b2d(recs[k]);
    const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download='french-a1-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();
    try{localStorage.setItem('fr-lastbk',Date.now())}catch(e){}
    $('bk').textContent='Backup downloaded ✓';
  }catch(e){$('bk').textContent='Could not create the backup.'}
};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async()=>{
  const f=$('impf').files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());let n=0;
    const list=d.notes||(d.items||[]).map(x=>({...x,id:'n'+x.id,ts:x.id}));
    for(const x of list){if(!x.fr)continue;
      const it={id:x.id,ts:x.ts||+String(x.id).slice(1),fr:x.fr,ipa:x.ipa||'',bnph:x.bnph||'',enph:x.enph||'',bn:x.bn||'',en:x.en||'',day:x.day||new Date().toISOString().slice(0,10)};
      const i=notes.findIndex(o=>o.id===it.id);if(i>=0)notes[i]=it;else notes.push(it);
      await put('notes',it);if(x.audio){recs[it.id]=d2b(x.audio);await put('rec',{id:it.id,blob:recs[it.id]})}n++}
    for(const k in d.lessonRecs||{}){recs[k]=d2b(d.lessonRecs[k]);await put('rec',{id:k,blob:recs[k]});n++}
    render();$('bk').textContent='Imported '+n+' item(s) ✓';
  }catch(e){$('bk').textContent='That file could not be read.'}
  $('impf').value='';
};
try{const t=localStorage.getItem('fr-lastbk');if(t)$('bk').textContent='Last backup: '+new Date(+t).toLocaleDateString()+'. Tip: back up once a week.'}catch(e){}
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=voiceNote}
voiceNote();
load();
</script>
